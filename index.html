<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibhay Kumar Pandey</title>
<meta name="description" content="Vibhay Kumar Pandey — Software Developer at Ericsson.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
  crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
  :root{
    --bg:#0b1017;
    --panel:#121a24;
    --panel-border:#223140;
    --text:#eef2f6;
    --text-muted:#93a0ae;
    --accent:#2f5fd6;
    --accent-2:#e6a23c;
    --teal:#4fd1c5;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}

  .hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    padding:0 6vw;
    overflow:hidden;
  }

  /* ambient background: soft radial glow + grid, stands in for a photo */
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 18% 30%, rgba(47,95,214,.28), transparent 45%),
      radial-gradient(circle at 85% 70%, rgba(230,162,60,.14), transparent 40%),
      linear-gradient(180deg, #0b1017 0%, #0d1420 100%);
    z-index:0;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--panel-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-border) 1px, transparent 1px);
    background-size:56px 56px;
    opacity:.09;
    z-index:0;
    mask-image:linear-gradient(180deg, transparent, black 30%, black 70%, transparent);
  }

  .hero-grid{
    position:relative; z-index:2;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:48px;
    align-items:center;
  }

  /* left: decorative terminal, stands in for the portrait photo */
  .visual{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.7);
    overflow:hidden;
    transform:translateY(0);
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
  .visual-bar{display:flex; align-items:center; gap:7px; padding:12px 16px; background:#0e1620; border-bottom:1px solid var(--panel-border);}
  .visual-bar span{width:10px; height:10px; border-radius:50%;}
  .visual-bar .r{background:#e0605a;} .visual-bar .y{background:#e6b84f;} .visual-bar .g{background:#4fd18a;}
  .visual-bar .tag{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text-muted);}
  .visual-body{padding:26px 24px 30px; font-family:var(--mono); font-size:14px; line-height:2; color:var(--text-muted);}
  .visual-body .p{color:var(--teal);}
  .visual-body .c{color:var(--text);}
  .visual-body .ok{color:#4fd18a;}
  .visual-body .k{color:var(--accent-2);}
  .caret{display:inline-block; width:8px; height:15px; background:var(--accent-2); vertical-align:middle; margin-left:2px; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* right: name block */
  .content{padding:20px 0;}
  .name-highlight{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(30px, 5vw, 52px);
    line-height:1.15;
    padding:10px 20px;
    margin-bottom:22px;
    box-shadow:0 14px 40px -14px rgba(47,95,214,.6);
  }
  .role-line{
    font-size:clamp(19px, 2.4vw, 26px);
    color:var(--text-muted);
    margin-bottom:34px;
    font-family:var(--sans);
  }
  .role-line .who{color:var(--text); font-weight:600;}
  .role-line #role-type{color:var(--accent-2); font-weight:600;}
  .role-line #role-type::after{content:"|"; margin-left:2px; animation:blink 1s step-end infinite;}

  .icon-row{display:flex; gap:18px; flex-wrap:wrap;}
  .icon-row a{
    width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    font-size:20px;
    color:var(--text-muted);
    transition:all .18s ease;
  }
  .icon-row a:hover{
    color:#fff;
    border-color:var(--accent);
    background:var(--accent);
    transform:translateY(-3px);
  }

  .subline{
    margin-top:38px;
    font-family:var(--mono); font-size:13px; color:#5a6878;
    display:flex; gap:20px; flex-wrap:wrap;
  }

  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr; text-align:left;}
    .visual{order:2;}
    .content{order:1;}
    .hero{padding:100px 6vw 60px;}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-grid">

    <div class="visual">
      <div class="visual-bar">
        <span class="r"></span><span class="y"></span><span class="g"></span>
        <span class="tag">vibhay@ericsson:~</span>
      </div>
      <div class="visual-body">
        <div><span class="p">$</span> <span class="c">whoami</span></div>
        <div class="ok">vibhay-kumar-pandey</div>
        <br>
        <div><span class="p">$</span> <span class="c">cat role.txt</span></div>
        <div><span class="k">title:</span> Software Developer</div>
        <div><span class="k">company:</span> Ericsson</div>
        <div><span class="k">stack:</span> Java, Spring Boot, K8s, AWS</div>
        <br>
        <div><span class="p">$</span> <span class="c">status</span></div>
        <div class="ok">✓ open to good problems</div>
        <div><span class="p">$</span><span class="caret"></span></div>
      </div>
    </div>

    <div class="content">
      <div class="name-highlight">Vibhay Kumar Pandey</div>
      <p class="role-line">I'm a <span class="who">Software Developer</span> — <span id="role-type"></span></p>

      <div class="icon-row">
        <a href="https://github.com/Vibhaypandey/" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="mailto:vibhaypandey2000@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
        <a href="https://www.linkedin.com/in/vibhay-pandey-dev/" target="_blank" rel="noopener" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://leetcode.com/u/vibhay8583pandey/" target="_blank" rel="noopener" title="LeetCode"><i class="fas fa-code"></i></a>
        <a href="Vibhay_Kumar_Pandey_Resume.pdf" target="_blank" rel="noopener" title="Resume"><i class="fas fa-file-lines"></i></a>
      </div>

      <div class="subline">
        <span>vibhaypandey2000@gmail.com</span>
        <span>+91 62668 30971</span>
        <span>Noida, India</span>
      </div>
    </div>

  </div>
</section>

<script>
  const roles = ["Java Backend Developer", "Kubernetes & AWS", "Open Source Enthusiast", "Problem Solver"];
  const el = document.getElementById('role-type');
  let ri = 0, ci = 0, deleting = false;

  function tick(){
    const word = roles[ri];
    if(!deleting){
      ci++;
      el.textContent = word.slice(0, ci);
      if(ci === word.length){ deleting = true; setTimeout(tick, 1400); return; }
    } else {
      ci--;
      el.textContent = word.slice(0, ci);
      if(ci === 0){ deleting = false; ri = (ri+1) % roles.length; }
    }
    setTimeout(tick, deleting ? 40 : 75);
  }
  tick();
</script>

</body>
</html>
